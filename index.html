<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Staff engineer with 15+ years building software." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link

    />
    <link rel="stylesheet" href="style.css" />
    <title>Linear — Staff Engineer</title>

  <body>
    <canvas id="circuit" aria-hidden="true"></canvas>

    <main class="hero">
      <p class="section-label">// linearza</p>

      <p class="hero__title">Staff Engineer</p>

        15+ years building software. Currently navigating the grid —
        <em>watching for the dawn.</em>

      <a id="contact-btn" href="#" class="contact-btn">
        <span>Get in touch</span>

    <script src="canvas.js"></script>
    <script>
      (function () {
        const parts = ["hello", "@", "linear", ".", "co", ".", "za"];
        const btn = document.getElementById("contact-btn");
        btn.href = "mailto:" + parts.join("");
      })();
