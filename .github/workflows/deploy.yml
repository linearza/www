name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.WWW_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.WWW_PATH }}"
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash ${{ secrets.WWW_PATH }}/api/setup.sh"
          rm -f ~/.ssh/deploy_key
