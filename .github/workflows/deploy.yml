name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Site checks
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: ./scripts/check.sh

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.WWW_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='scripts' \
            --exclude='deploy' \
            --exclude='*.md' \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.WWW_PATH }}"
          # The converge script is copied in, run, and removed; it is never published
          scp -i ~/.ssh/deploy_key deploy/converge.sh \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/linear-converge.sh"
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "WWW_ROOT='${{ secrets.WWW_PATH }}' bash /tmp/linear-converge.sh; rc=\$?; rm -f /tmp/linear-converge.sh; exit \$rc"
          rm -f ~/.ssh/deploy_key
